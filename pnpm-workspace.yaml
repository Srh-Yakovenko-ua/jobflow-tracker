packages:
  - 'apps/*'
  - 'packages/*'
  - 'services/*'

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': false
  argon2: false
  esbuild: false
  msgpackr-extract: false
  prisma: false
  unrs-resolver: false

overrides:
  body-parser: ^2.4.0
  handlebars: ^4.7.10
  multer: ^2.5.0

audit:
  ignore:
    - GHSA-vfj7-8cjw-p6xm

minimumReleaseAgeExclude:
  - '@rollup/rollup-darwin-x64@4.64.9'
  - '@rollup/rollup-linux-ppc64-musl@4.64.9'
  - '@rollup/rollup-linux-riscv64-gnu@4.64.9'
  - '@rollup/rollup-linux-x64-musl@4.64.9'
  - '@rollup/rollup-openbsd-x64@4.64.9'
  - '@rollup/rollup-openharmony-arm64@4.64.9'
  - bullmq@6.3.17
