  - 'packages/*'
  - 'services/*'

allowBuilds:
  esbuild: false
  unrs-resolver: false

overrides:
  handlebars: ^4.7.10

audit:
  ignore:
    - GHSA-vfj7-8cjw-p6xm

minimumReleaseAgeExclude:
