name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AFFECTED: ${{ github.event_name == 'pull_request' && '--filter=...[origin/main]' || '' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          if files=$(git -c core.quotePath=false diff --name-only "$BASE" HEAD); then
            if ! grep -qvE '^docs/|\.md$' <<< "$files" && ! grep -qx 'docs/diagrams/erd.md' <<< "$files"; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm dup
      - run: pnpm turbo run lint ${{ env.AFFECTED }}

  typecheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm turbo run typecheck ${{ env.AFFECTED }}

  unit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm turbo run test ${{ env.AFFECTED }}
      - name: Coverage table
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          {
            echo '### Coverage'
            echo ''
            echo '| package | lines | branches | functions | statements |'
            echo '| --- | --- | --- | --- | --- |'
            for summary in apps/*/coverage/coverage-summary.json packages/*/coverage/coverage-summary.json; do
              package=$(basename "$(dirname "$(dirname "$summary")")")
              jq -r --arg package "$package" '"| \($package) | \(.total.lines.pct)% | \(.total.branches.pct)% | \(.total.functions.pct)% | \(.total.statements.pct)% |"' "$summary"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: |
            apps/*/coverage
            packages/*/coverage
          if-no-files-found: ignore

  integration:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://jobflow_app:jobflow_app@localhost:5432/jobflow_test
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8.10.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - name: Create roles and the test database
        run: docker exec -i -e POSTGRES_APP_PASSWORD=jobflow_app -e POSTGRES_ANALYTICS_PASSWORD=jobflow_analytics ${{ job.services.postgres.id }} sh -s < infra/docker/postgres/init-databases.sh
      - name: Reset and seed the test database
        run: cp .env.example .env && pnpm db:reset && pnpm db:seed
      - run: pnpm test:int
        env:
          REDIS_URL: redis://localhost:6379
      - name: Schema matches the migrations
        run: pnpm --filter @jobflow/api exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

  contracts:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm contracts
      - run: pnpm --filter @jobflow/api db:erd
      - run: git diff --exit-code -- docs/diagrams/erd.md

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        if: hashFiles('apps/api/Dockerfile', 'apps/web/Dockerfile', 'services/analytics/Dockerfile') != ''
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        if: hashFiles('apps/api/Dockerfile') != ''
        with:
          context: .
          file: apps/api/Dockerfile
          target: prod
          push: false
          load: true
          tags: jobflow-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        if: hashFiles('apps/web/Dockerfile') != ''
        with:
          context: .
          file: apps/web/Dockerfile
          target: prod
          push: false
          load: true
          tags: jobflow-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        if: hashFiles('services/analytics/Dockerfile') != ''
        with:
          context: services/analytics
          target: prod
          push: false
          load: true
          tags: jobflow-analytics:ci
          cache-from: type=gha,scope=analytics
          cache-to: type=gha,mode=max,scope=analytics
      - name: Image sizes
        run: |
          {
            echo '### Images'
            echo ''
            echo '| image | size |'
            echo '| --- | --- |'
            docker image ls --filter reference='jobflow-*:ci' --format '| {{.Repository}} | {{.Size}} |'
          } >> "$GITHUB_STEP_SUMMARY"

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm audit --prod --audit-level high
