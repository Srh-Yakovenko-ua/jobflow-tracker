name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AFFECTED: ${{ github.event_name == 'pull_request' && '--filter=...[origin/main]' || '' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      ai: ${{ steps.diff.outputs.ai }}
      documents: ${{ steps.diff.outputs.documents }}
      analytics: ${{ steps.diff.outputs.analytics }}
      live_load: ${{ steps.diff.outputs.live_load }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          ai=true
          documents=true
          analytics=true
          live_load=false
          if files=$(git -c core.quotePath=false diff --name-only "$BASE" HEAD); then
            if ! grep -qvE '^docs/|\.md$' <<< "$files" && ! grep -qxF -e 'docs/diagrams/erd.md' -e 'docs/api/openapi.json' <<< "$files"; then
              code=false
            fi
            if ! grep -qE '^(services/ai|packages/shared/src/ai)/' <<< "$files"; then
              ai=false
            fi
            if ! grep -qE '^services/documents/' <<< "$files"; then
              documents=false
            fi
            if ! grep -qE '^services/analytics/' <<< "$files"; then
              analytics=false
            fi
            if grep -qxF 'apps/api/src/modules/live/live-load.int.test.ts' <<< "$files"; then
              live_load=true
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "ai=$ai" >> "$GITHUB_OUTPUT"
          echo "documents=$documents" >> "$GITHUB_OUTPUT"
          echo "analytics=$analytics" >> "$GITHUB_OUTPUT"
          echo "live_load=$live_load" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm dup
      - run: pnpm turbo run lint ${{ env.AFFECTED }}

  typecheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm turbo run typecheck ${{ env.AFFECTED }}

  unit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm turbo run test ${{ env.AFFECTED }}
      - name: Coverage table
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          {
            echo '### Coverage'
            echo ''
            echo '| package | lines | branches | functions | statements |'
            echo '| --- | --- | --- | --- | --- |'
            for summary in apps/*/coverage/coverage-summary.json packages/*/coverage/coverage-summary.json bookmarklet/coverage/coverage-summary.json; do
              [[ -f $summary ]] || continue
              package=$(basename "$(dirname "$(dirname "$summary")")")
              jq -r --arg package "$package" '"| \($package) | \(.total.lines.pct)% | \(.total.branches.pct)% | \(.total.functions.pct)% | \(.total.statements.pct)% |"' "$summary"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: |
            apps/*/coverage
            packages/*/coverage
            bookmarklet/coverage
          if-no-files-found: ignore

  integration:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://jobflow_app:jobflow_app@localhost:5432/jobflow_test
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8.10.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - name: Create roles and the test database
        run: docker exec -i -e POSTGRES_APP_PASSWORD=jobflow_app -e POSTGRES_ANALYTICS_PASSWORD=jobflow_analytics ${{ job.services.postgres.id }} sh -s < infra/docker/postgres/init-databases.sh
      - name: Reset and seed the test database
        run: cp .env.example .env && pnpm gen:keys && pnpm db:reset && pnpm db:seed
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          working-directory: services/analytics
          enable-cache: true
      - name: Analytics reads as the read-only role
        working-directory: services/analytics
        env:
          DATABASE_URL_ANALYTICS: postgresql://jobflow_analytics:jobflow_analytics@127.0.0.1:5432/jobflow_test
          REDIS_URL: redis://127.0.0.1:6379
        run: uv sync --locked && uv run pytest tests_db
      - name: Start MinIO with the resume bucket
        run: docker compose up -d --wait --wait-timeout 120 minio && docker compose run --rm minio-init
      - run: pnpm test:int
        env:
          REDIS_URL: redis://localhost:6379
      - name: Live load test twenty times in a row
        if: github.event_name == 'pull_request' && needs.changes.outputs.live_load == 'true'
        env:
          REDIS_URL: redis://localhost:6379
        run: for run in $(seq 20); do pnpm --filter @jobflow/api test:int live-load.int || exit 1; done
      - name: Start the API for the analytics token check
        env:
          REDIS_URL: redis://localhost:6379
          RATE_LIMIT_REGISTER_PER_HOUR: 100
        run: |
          pnpm turbo run build --filter=@jobflow/api
          nohup pnpm --filter @jobflow/api start > "$RUNNER_TEMP/api.log" 2>&1 &
          curl -fsS --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:4000/.well-known/jwks.json
      - name: Analytics trusts tokens issued by the API
        working-directory: services/analytics
        env:
          API_URL: http://127.0.0.1:4000
          DATABASE_URL_ANALYTICS: postgresql://jobflow_analytics:jobflow_analytics@127.0.0.1:5432/jobflow_test
          REDIS_URL: redis://127.0.0.1:6379
        run: uv run pytest tests_api
      - name: API log
        if: failure()
        run: cat "$RUNNER_TEMP/api.log"
      - name: Schema matches the migrations
        run: pnpm --filter @jobflow/api exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

  contracts:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          working-directory: services/ai
          enable-cache: true
      - run: pnpm contracts
      - run: pnpm --filter @jobflow/api db:erd
      - run: git diff --exit-code -- docs/diagrams/erd.md
      - run: pnpm gen:contracts
      - run: git diff --exit-code -- services/ai/app/contracts services/documents/app/contracts services/analytics/app/core/enums.json

  ai:
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          working-directory: services/ai
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest --cov=app

  documents:
    needs: changes
    if: needs.changes.outputs.documents == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/documents
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          working-directory: services/documents
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest --cov=app

  analytics:
    needs: changes
    if: needs.changes.outputs.analytics == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/analytics
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          working-directory: services/analytics
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest --cov=app --cov-report=term --cov-report=xml
      - run: uv run coverage report --include='app/metrics/*' --fail-under=85
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: analytics-coverage
          path: services/analytics/coverage.xml
          if-no-files-found: error

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        if: hashFiles('apps/api/Dockerfile', 'apps/web/Dockerfile', 'services/analytics/Dockerfile', 'services/ai/Dockerfile', 'services/documents/Dockerfile') != ''
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        if: hashFiles('apps/api/Dockerfile') != ''
        with:
          context: .
          file: apps/api/Dockerfile
          target: prod
          push: false
          load: true
          tags: jobflow-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        if: hashFiles('apps/web/Dockerfile') != ''
        with:
          context: .
          file: apps/web/Dockerfile
          target: prod
          push: false
          load: true
          tags: jobflow-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        if: hashFiles('services/analytics/Dockerfile') != ''
        with:
          context: .
          file: services/analytics/Dockerfile
          target: prod
          push: false
          load: true
          tags: jobflow-analytics:ci
          cache-from: type=gha,scope=analytics
          cache-to: type=gha,mode=max,scope=analytics
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        if: hashFiles('services/ai/Dockerfile') != ''
        with:
          context: .
          file: services/ai/Dockerfile
          target: prod
          push: false
          load: true
          tags: jobflow-ai:ci
          cache-from: type=gha,scope=ai
          cache-to: type=gha,mode=max,scope=ai
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        if: hashFiles('services/documents/Dockerfile') != ''
        with:
          context: .
          file: services/documents/Dockerfile
          target: prod
          push: false
          load: true
          tags: jobflow-documents:ci
          cache-from: type=gha,scope=documents
          cache-to: type=gha,mode=max,scope=documents
      - name: Image sizes
        run: |
          {
            echo '### Images'
            echo ''
            echo '| image | size |'
            echo '| --- | --- |'
            docker image ls --filter reference='jobflow-*:ci' --format '| {{.Repository}} | {{.Size}} |'
          } >> "$GITHUB_STEP_SUMMARY"

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm audit --prod --audit-level high
