name: E2E

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          if files=$(git -c core.quotePath=false diff --name-only "$BASE" HEAD); then
            if ! grep -qvE '^docs/|\.md$' <<< "$files" && ! grep -qxF -e 'docs/diagrams/erd.md' -e 'docs/api/openapi.json' -e README.md -e README.en.md <<< "$files"; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      API_NODE_ENV: test
      DATABASE_URL: postgresql://jobflow_app:jobflow_app@localhost:5432/jobflow
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/images
      - name: README quick start
        run: |
          quick_start() { sed -n '/^<!-- quick-start -->$/,/^<!-- \/quick-start -->$/p' "$1" | sed '/^<!--/d;/^```/d'; }
          diff <(quick_start README.md) <(quick_start README.en.md)
          quick_start README.md > "$RUNNER_TEMP/quick-start.sh"
          grep -qx 'pnpm demo:seed' "$RUNNER_TEMP/quick-start.sh"
          bash -euo pipefail "$RUNNER_TEMP/quick-start.sh"
          docker compose config --images | grep -qx jobflow-web:ci
      - name: Raise the sign-up limits for the suite
        run: |
          printf 'RATE_LIMIT_REGISTER_PER_HOUR=100\nRATE_LIMIT_LOGIN_PER_MINUTE=60\n' >> .env
          docker compose up -d --wait --force-recreate api
      - id: playwright
        run: echo "version=$(jq -r '.devDependencies["@playwright/test"]' apps/web/package.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm --filter @jobflow/web exec playwright install --with-deps chromium firefox
      - run: pnpm test:e2e ${{ github.event_name == 'schedule' && '-- --repeat-each=3 --global-timeout=1080000' || '' }}
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: playwright
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color
