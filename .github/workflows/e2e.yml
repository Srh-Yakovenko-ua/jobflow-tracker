name: E2E

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        uses: ./.github/actions/changes

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      API_NODE_ENV: test
      DATABASE_URL: postgresql://jobflow_app:jobflow_app@localhost:5432/jobflow
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/images
      - uses: ./.github/actions/quick-start
      - name: Raise the sign-up limits for the suite
        run: |
          printf 'RATE_LIMIT_REGISTER_PER_HOUR=100\nRATE_LIMIT_LOGIN_PER_MINUTE=60\n' >> .env
          docker compose up -d --wait --force-recreate api
      - id: playwright
        run: echo "version=$(jq -r '.devDependencies["@playwright/test"]' apps/web/package.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm --filter @jobflow/web exec playwright install --with-deps chromium firefox
      - run: pnpm test:e2e ${{ github.event_name == 'schedule' && '-- --repeat-each=3 --global-timeout=1080000' || '' }}
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: playwright
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color

  fuzz:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://jobflow_app:jobflow_app@localhost:5432/jobflow
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/images
      - uses: ./.github/actions/quick-start
      - name: Raise the rate limits for fuzzing
        run: |
          printf '%s=100000\n' RATE_LIMIT_API_PER_MINUTE RATE_LIMIT_AI_PER_HOUR RATE_LIMIT_CAPTURE_PER_HOUR RATE_LIMIT_LOGIN_PER_MINUTE RATE_LIMIT_REGISTER_PER_HOUR >> .env
          docker compose up -d --wait --force-recreate api
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Schemathesis against the API and analytics
        shell: bash
        run: |
          status=0
          fuzz() {
            local name=$1 spec=$2 url=$3 token
            token=$(curl -fsS -X POST http://localhost:4000/api/v1/auth/login -H 'Content-Type: application/json' -d '{"email":"demo@jobflow.local","password":"jobflow-demo"}' | jq -r .accessToken)
            uvx schemathesis==4.32.7 run "$spec" --url "$url" \
              --checks not_a_server_error,response_schema_conformance,ignored_auth \
              -H "Authorization: Bearer $token" \
              --max-examples 50 --request-timeout 10 --continue-on-failure \
              --report junit --report-dir "$RUNNER_TEMP/schemathesis/$name" || status=1
          }
          fuzz api docs/api/openapi.json http://localhost:4000/api/v1
          fuzz analytics http://localhost:8000/openapi.json http://localhost:8000
          exit "$status"
      - uses: actions/upload-artifact@v7.0.2
        if: '!cancelled()'
        with:
          name: schemathesis
          path: ${{ runner.temp }}/schemathesis
          if-no-files-found: ignore
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color
