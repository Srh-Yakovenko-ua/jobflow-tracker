name: Images
description: Build the prod images of api, web, analytics, ai and documents as jobflow-<service>:ci, sharing the gha layer cache per service
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: .
        file: apps/api/Dockerfile
        target: prod
        push: false
        load: true
        tags: jobflow-api:ci
        cache-from: type=gha,scope=api
        cache-to: type=gha,mode=max,scope=api
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: .
        file: apps/web/Dockerfile
        target: prod
        push: false
        load: true
        tags: jobflow-web:ci
        cache-from: type=gha,scope=web
        cache-to: type=gha,mode=max,scope=web
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: .
        file: services/analytics/Dockerfile
        target: prod
        push: false
        load: true
        tags: jobflow-analytics:ci
        cache-from: type=gha,scope=analytics
        cache-to: type=gha,mode=max,scope=analytics
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: .
        file: services/ai/Dockerfile
        target: prod
        push: false
        load: true
        tags: jobflow-ai:ci
        cache-from: type=gha,scope=ai
        cache-to: type=gha,mode=max,scope=ai
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: .
        file: services/documents/Dockerfile
        target: prod
        push: false
        load: true
        tags: jobflow-documents:ci
        cache-from: type=gha,scope=documents
        cache-to: type=gha,mode=max,scope=documents
