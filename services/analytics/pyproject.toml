[project]
name = "jobflow-analytics"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "loguru>=0.7.3",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "redis>=8.1.0",
    "sqlalchemy[postgresql-asyncpg]>=2.1.8",
    "uvicorn>=0.54.0",
]

[tool.ruff.lint]
extend-select = ["PLR0913", "PLR0915", "PLR0917", "FBT001", "FBT002", "C901"]

[tool.ruff.lint.per-file-ignores]
"app/core/request_id.py" = ["PLR0917"]

[tool.ruff.lint.pylint]
max-args = 5
max-positional-args = 2
max-statements = 30

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "--disable-socket --allow-unix-socket --allow-hosts=127.0.0.1"
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "hypothesis==6.170.15",
    "mypy==2.4.1",
    "pandas-stubs==3.1.0.261029",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-socket==0.8.1",
    "ruff==0.17.3",
]
