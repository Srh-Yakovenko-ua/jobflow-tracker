services:
  api:
    build:
      target: dev
    volumes:
      - ../../apps/api/src:/app/apps/api/src

  worker:
    build:
      target: dev
    volumes:
      - ../../apps/api/src:/app/apps/api/src
    command:
      [
        'node',
        'node_modules/@nestjs/cli/bin/nest.js',
        'start',
        '--watch',
        '--entryFile',
        'worker',
        '-p',
        'tsconfig.worker.json',
      ]

  web:
    build:
      target: dev
    mem_limit: 1536m
    volumes:
      - ../../apps/web/src:/app/apps/web/src
