global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:4000']

  - job_name: worker
    static_configs:
      - targets: ['worker:9464']

  - job_name: analytics
    static_configs:
      - targets: ['analytics:8000']

  - job_name: ai
    static_configs:
      - targets: ['ai:8001']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
