groups:
  - name: jobflow
    rules:
      - record: analytics_cache_hit_ratio
        expr: sum(rate(analytics_cache_lookups_total{result="hit"}[5m])) / sum(rate(analytics_cache_lookups_total[5m]))

      - alert: JobflowHighErrorRate
        expr: sum(rate(http_request_duration_seconds_count{job="api",status=~"5.."}[5m])) / sum(rate(http_request_duration_seconds_count{job="api"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: More than 5% of api requests answer 5xx

      - alert: JobflowOutboxLag
        expr: max(jobflow_outbox_lag_seconds) > 30
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: The oldest unpublished outbox row is older than 30 seconds
