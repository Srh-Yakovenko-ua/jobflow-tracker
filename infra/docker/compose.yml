name: jobflow

x-api-environment: &api-environment
  DATABASE_URL: postgresql://jobflow_app:${POSTGRES_APP_PASSWORD:-jobflow_app}@postgres:5432/jobflow
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000
  SMTP_URL: smtp://mailpit:1025
  JWT_PRIVATE_KEY_PATH: /app/.secrets/jwt-private.pem
  JWT_PUBLIC_KEY_PATH: /app/.secrets/jwt-public.pem
  AI_SERVICE_URL: http://ai:8001

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-jobflow_app}
      POSTGRES_ANALYTICS_PASSWORD: ${POSTGRES_ANALYTICS_PASSWORD:-jobflow_analytics}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d jobflow']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    mem_limit: 512m
    networks:
      - jobflow

  redis:
    image: redis:8.10.2-alpine
    volumes:
      - redisdata:/data
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    networks:
      - jobflow

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-jobflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-jobflow-minio}
    volumes:
      - miniodata:/data
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    mem_limit: 512m
    networks:
      - jobflow

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    command: ['mb', '--ignore-existing', 'jobflow/resumes']
    environment:
      MC_HOST_jobflow: http://${MINIO_ROOT_USER:-jobflow}:${MINIO_ROOT_PASSWORD:-jobflow-minio}@minio:9000
    depends_on:
      minio:
        condition: service_healthy
    mem_limit: 64m
    networks:
      - jobflow

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m
    networks:
      - jobflow

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: ../../.env
        required: false
    environment:
      <<: *api-environment
      HOST: 0.0.0.0
    volumes:
      - ../../.secrets:/app/.secrets:ro
    ports:
      - '127.0.0.1:4000:4000'
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/v1/health').then((res) => process.exit(res.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    mem_limit: 512m
    networks:
      - jobflow

  worker:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: ../../.env
        required: false
    environment: *api-environment
    volumes:
      - ../../.secrets:/app/.secrets:ro
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 60s
    healthcheck:
      disable: true
    mem_limit: 512m
    networks:
      - jobflow

  ai:
    build:
      context: ../..
      dockerfile: services/ai/Dockerfile
    env_file:
      - path: ../../services/ai/.env
        required: false
    environment:
      API_JWKS_URL: http://api:4000/.well-known/jwks.json
    ports:
      - '127.0.0.1:8001:8001'
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    mem_limit: 256m
    networks:
      - jobflow

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then((res) => process.exit(res.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    mem_limit: 512m
    networks:
      - jobflow

networks:
  jobflow:
    name: jobflow

volumes:
  pgdata:
  redisdata:
  miniodata:
