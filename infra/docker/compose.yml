name: jobflow

x-api-environment: &api-environment
  DATABASE_URL: postgresql://jobflow_app:${POSTGRES_APP_PASSWORD:-jobflow_app}@postgres:5432/jobflow
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: http://localhost:9000
  SMTP_URL: smtp://mailpit:1025
  JWT_PRIVATE_KEY_PATH: /app/.secrets/jwt-private.pem
  JWT_PUBLIC_KEY_PATH: /app/.secrets/jwt-public.pem
  AI_SERVICE_URL: http://ai:8001
  ANALYTICS_URL: http://analytics:8000
  DOCUMENTS_SERVICE_URL: http://documents:8002
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:+http://alloy:4318}
  SENTRY_DSN: ${SENTRY_DSN:+http://${GLITCHTIP_DSN_KEY:-3e1d458052fe5e094290f89b928b7db2}@glitchtip:8000/1}
  SENTRY_RELEASE: ${SENTRY_RELEASE:-}

x-glitchtip-environment: &glitchtip-environment
  DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/glitchtip
  SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-36c66ab0deb723a6b013c1d870ce6aa731577e77ec00aab4}
  GLITCHTIP_DOMAIN: http://localhost:8003
  VALKEY_URL: ''
  ENABLE_USER_REGISTRATION: 'false'
  ENABLE_ORGANIZATION_CREATION: 'false'
  EMAIL_URL: smtp://mailpit:1025

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-jobflow_app}
      POSTGRES_ANALYTICS_PASSWORD: ${POSTGRES_ANALYTICS_PASSWORD:-jobflow_analytics}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d jobflow']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    mem_limit: 512m
    networks:
      - jobflow

  redis:
    image: redis:8.10.2-alpine
    volumes:
      - redisdata:/data
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    networks:
      - jobflow

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-jobflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-jobflow-minio}
    volumes:
      - miniodata:/data
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    mem_limit: 512m
    networks:
      - jobflow

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        mc mb --ignore-existing jobflow/resumes &&
        echo '{"Rules":[{"ID":"expire-pending-uploads","Status":"Enabled","Filter":{"Prefix":"pending/"},"Expiration":{"Days":1}}]}' |
        mc ilm rule import jobflow/resumes
    environment:
      MC_HOST_jobflow: http://${MINIO_ROOT_USER:-jobflow}:${MINIO_ROOT_PASSWORD:-jobflow-minio}@minio:9000
    depends_on:
      minio:
        condition: service_healthy
    mem_limit: 64m
    networks:
      - jobflow

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m
    networks:
      - jobflow

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: ../../.env
        required: false
    environment:
      <<: *api-environment
      HOST: 0.0.0.0
    volumes:
      - ../../.secrets:/app/.secrets:ro
    ports:
      - '127.0.0.1:4000:4000'
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/v1/health').then((res) => process.exit(res.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    mem_limit: 512m
    networks:
      - jobflow

  worker:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: ../../.env
        required: false
    environment:
      <<: *api-environment
      HOST: 0.0.0.0
    volumes:
      - ../../.secrets:/app/.secrets:ro
    depends_on:
      redis:
        condition: service_healthy
      documents:
        condition: service_healthy
    stop_grace_period: 60s
    healthcheck:
      disable: true
    mem_limit: 512m
    networks:
      - jobflow

  analytics:
    build:
      context: ../..
      dockerfile: services/analytics/Dockerfile
    environment:
      DATABASE_URL_ANALYTICS: postgresql://jobflow_analytics:${POSTGRES_ANALYTICS_PASSWORD:-jobflow_analytics}@postgres:5432/jobflow
      REDIS_URL: redis://redis:6379
      API_URL: http://api:4000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:+http://alloy:4318}
      SENTRY_DSN: ${SENTRY_DSN:+http://${GLITCHTIP_DSN_KEY:-3e1d458052fe5e094290f89b928b7db2}@glitchtip:8000/1}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    mem_limit: 512m
    networks:
      - jobflow

  ai:
    build:
      context: ../..
      dockerfile: services/ai/Dockerfile
    env_file:
      - path: ../../services/ai/${AI_ENV_FILE:-.env}
        required: false
    environment:
      API_JWKS_URL: http://api:4000/.well-known/jwks.json
      AI_FAKE_DELAY_SECONDS: ${AI_FAKE_DELAY_SECONDS:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:+http://alloy:4318}
    ports:
      - '127.0.0.1:8001:8001'
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    mem_limit: 256m
    networks:
      - jobflow

  documents:
    build:
      context: ../..
      dockerfile: services/documents/Dockerfile
    ports:
      - '127.0.0.1:8002:8002'
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - jobflow

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then((res) => process.exit(res.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    mem_limit: 512m
    networks:
      - jobflow

  loki:
    image: grafana/loki:3.7.10
    profiles: [observability]
    command:
      - -config.file=/etc/loki/local-config.yaml
      - -reporting.enabled=false
    volumes:
      - lokidata:/loki
    ports:
      - '127.0.0.1:3100:3100'
    healthcheck:
      disable: true
    mem_limit: 512m
    networks:
      - jobflow

  alloy:
    image: grafana/alloy:v1.21.3
    profiles: [observability]
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - '127.0.0.1:12345:12345'
      - '127.0.0.1:4317:4317'
      - '127.0.0.1:4318:4318'
    depends_on:
      loki:
        condition: service_started
      jaeger:
        condition: service_started
    healthcheck:
      disable: true
    mem_limit: 256m
    networks:
      - jobflow

  jaeger:
    image: jaegertracing/jaeger:2.23.0
    profiles: [observability]
    command: ['--config=/etc/jaeger/config.yaml']
    volumes:
      - ./observability/jaeger/config.yaml:/etc/jaeger/config.yaml:ro
    ports:
      - '127.0.0.1:16686:16686'
    healthcheck:
      disable: true
    mem_limit: 512m
    networks:
      - jobflow

  grafana:
    image: grafana/grafana:13.3.1
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '127.0.0.1:3001:3000'
    depends_on:
      loki:
        condition: service_started
      jaeger:
        condition: service_started
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/api/health']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    mem_limit: 512m
    networks:
      - jobflow

  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheusdata:/prometheus
    ports:
      - '127.0.0.1:9090:9090'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9090/-/ready']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    mem_limit: 512m
    networks:
      - jobflow

  node-exporter:
    image: prom/node-exporter:v1.12.1
    profiles: [observability]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9100/metrics']
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 64m
    networks:
      - jobflow

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    profiles: [observability]
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    mem_limit: 256m
    networks:
      - jobflow

  glitchtip-db:
    image: postgres:18.6-alpine
    profiles: [observability]
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        printf '%s\n' "SELECT 'CREATE DATABASE glitchtip' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'glitchtip')\gexec" |
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d postgres
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 64m
    networks:
      - jobflow

  glitchtip:
    image: glitchtip/glitchtip:7.0.0
    profiles: [observability]
    environment:
      <<: *glitchtip-environment
    ports:
      - '127.0.0.1:8003:8000'
    depends_on:
      glitchtip-db:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', 'healthcheck.py']
      interval: 5s
      timeout: 6s
      retries: 20
      start_period: 60s
    mem_limit: 512m
    networks:
      - jobflow

  glitchtip-bootstrap:
    image: glitchtip/glitchtip:7.0.0
    profiles: [observability]
    entrypoint: ['/bin/sh', '-c']
    command: ['python manage.py shell < /bootstrap/bootstrap.py']
    environment:
      <<: *glitchtip-environment
      GLITCHTIP_ADMIN_EMAIL: ${GLITCHTIP_ADMIN_EMAIL:-admin@jobflow.local}
      GLITCHTIP_ADMIN_PASSWORD: ${GLITCHTIP_ADMIN_PASSWORD:-jobflow-glitchtip}
      GLITCHTIP_DSN_KEY: ${GLITCHTIP_DSN_KEY:-3e1d458052fe5e094290f89b928b7db2}
      SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-6c49ae8c9fe1631175c7809ad8771f561c7b341881423357c73b92f236c86030}
    volumes:
      - ./observability/glitchtip/bootstrap.py:/bootstrap/bootstrap.py:ro
    depends_on:
      glitchtip:
        condition: service_healthy
    mem_limit: 256m
    networks:
      - jobflow

networks:
  jobflow:
    name: jobflow

volumes:
  pgdata:
  redisdata:
  miniodata:
  lokidata:
  prometheusdata:
