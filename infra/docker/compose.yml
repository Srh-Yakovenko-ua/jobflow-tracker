name: jobflow

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-jobflow_app}
      POSTGRES_ANALYTICS_PASSWORD: ${POSTGRES_ANALYTICS_PASSWORD:-jobflow_analytics}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d jobflow']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    mem_limit: 512m
    networks:
      - jobflow

  redis:
    image: redis:8.10.2-alpine
    volumes:
      - redisdata:/data
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    networks:
      - jobflow

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-jobflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-jobflow-minio}
    volumes:
      - miniodata:/data
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    mem_limit: 512m
    networks:
      - jobflow

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    command: ['mb', '--ignore-existing', 'jobflow/resumes']
    environment:
      MC_HOST_jobflow: http://${MINIO_ROOT_USER:-jobflow}:${MINIO_ROOT_PASSWORD:-jobflow-minio}@minio:9000
    depends_on:
      minio:
        condition: service_healthy
    mem_limit: 64m
    networks:
      - jobflow

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m
    networks:
      - jobflow

networks:
  jobflow:
    name: jobflow

volumes:
  pgdata:
  redisdata:
  miniodata:
